- name: Listen for newly added VM resources
  hosts: all
  sources:
      #   - sabre1041.eda.k8s:
      #       apiVersion: kubevirt.io/v1
      #       kind: VirtualMachine
      #       namespace: test
      # rules:
      #   - name: Execute Inventory Update
      #     condition: event.type == "ADDED"
      #     action:
      #       run_job_template:
      #         name: update_vm_inventory
      #         organization: Default
  sources:
    - sabre1041.eda.k8s:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        namespace: golden-image
  rules:
    - name: Notify
      condition: event.type == "ADDED"
      actions:
        - debug:
            msg: "Checking for newly added VM resources"
        - run_job_template:
            organization: Default
            name: update_ocpv
    - name: Notify
      condition: event.type == "MODIFIED
      actions:
        - debug:
            msg: "VM has been modified"
        - run_job_template:
            organization: Default
            name: update_ocpv